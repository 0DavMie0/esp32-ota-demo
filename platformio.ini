; Proyecto de demo: actualización OTA desde GitHub
; Placa: ESP32-2432S024R (pantalla 2.4" ILI9341 + táctil resistivo XPT2046)

[env:cyd24]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Consola serie: ver lo que escribes y enviar la línea al pulsar Enter
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = LF
upload_speed = 921600

; Particiones con dos huecos grandes para el firmware (necesario para OTA con HTTPS)
board_build.partitions = min_spiffs.csv

lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  tzapu/WiFiManager@2.0.17

; Configuración de la pantalla para TFT_eSPI.
; Sustituye al User_Setup.h de la librería: así va dentro del proyecto
; y GitHub puede compilarlo sin tocar nada.
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=27
  -D TFT_BACKLIGHT_ON=HIGH
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D DISABLE_ALL_LIBRARY_WARNINGS=1