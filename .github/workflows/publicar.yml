name: Publicar firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Número de versión (por ejemplo 1.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Comprobar el número de versión y escribir version.h
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "La versión debe tener el formato 1.2 (dos números separados por un punto)"
            exit 1
          fi
          cat > include/version.h << EOT
          // Versión del firmware.
          // GitHub actualiza este archivo automáticamente cada vez que publicas una versión.
          // Solo se usa directamente cuando compilas y flasheas por USB desde el PC.
          #define FW_VERSION "$VERSION"
          EOT

      - name: Caché de PlatformIO (acelera compilaciones siguientes)
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar PlatformIO
        run: pip install platformio

      - name: Compilar
        run: pio run -e cyd24

      - name: Publicar la versión
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: Versión ${{ inputs.version }}
          files: .pio/build/cyd24/firmware.bin

      - name: Guardar el número de versión en el repositorio
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/version.h
          if git diff --cached --quiet; then
            echo "version.h ya estaba al día"
          else
            git commit -m "Versión $VERSION"
            git pull --rebase
            git push
          fi
